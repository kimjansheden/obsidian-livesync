<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Self-hosted LiveSync Setup QR Aggregator</title>
        <style>
            body {
                font-family: sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
                background-color: #f4f4f9;
                color: #333;
            }
            .container {
                background: white;
                padding: 2rem;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                text-align: center;
                max-width: 90%;
            }
            .progress {
                margin: 20px 0;
                font-size: 1.2rem;
                font-weight: bold;
            }
            .status {
                margin-bottom: 20px;
                color: #666;
            }
            .btn {
                display: inline-block;
                padding: 12px 24px;
                background-color: #7c4dff;
                color: white;
                text-decoration: none;
                border-radius: 4px;
                font-weight: bold;
                transition: background-color 0.2s;
                border: none;
                cursor: pointer;
            }
            .btn:hover {
                background-color: #651fff;
            }
            .btn:disabled {
                background-color: #ccc;
                cursor: not-allowed;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
                gap: 8px;
                margin: 20px 0;
            }
            .tile {
                width: 40px;
                height: 40px;
                border: 2px solid #ddd;
                border-radius: 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.8rem;
            }
            .tile.filled {
                background-color: #7c4dff;
                color: white;
                border-color: #7c4dff;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>LiveSync Setup</h1>
            <div id="app">
                <p>Checking hash data...</p>
            </div>
        </div>

        <script>
            function appendElement(parent, tag, text, className) {
                const element = document.createElement(tag);
                element.textContent = text;
                if (className) element.className = className;
                parent.append(element);
                return element;
            }

            function updateUI() {
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);
                const id = params.get("id");
                const total = Number.parseInt(params.get("n") || "0", 10);
                const index = Number.parseInt(params.get("i") || "-1", 10);
                // Keep the chunk percent-encoded so URI delimiters remain part of the settings payload.
                const data = hash.match(/(?:^|&)d=([^&]*)/)?.[1];
                const app = document.getElementById("app");
                app.replaceChildren();

                if (
                    !id ||
                    !/^[a-z0-9_-]{1,128}$/i.test(id) ||
                    !Number.isSafeInteger(total) ||
                    total <= 0 ||
                    total > 1000 ||
                    !Number.isSafeInteger(index) ||
                    index < 0 ||
                    index >= total ||
                    !data
                ) {
                    appendElement(app, "p", "Invalid setup URL. Please scan the QR code correctly.", "status");
                    return;
                }

                const storageKey = "ls_agg_" + id;
                const session = Object.create(null);
                try {
                    const stored = JSON.parse(localStorage.getItem(storageKey) || "{}");
                    if (stored && typeof stored === "object" && !Array.isArray(stored)) {
                        for (const [key, value] of Object.entries(stored)) {
                            const part = Number.parseInt(key, 10);
                            if (String(part) === key && part >= 0 && part < total && typeof value === "string") {
                                session[part] = value;
                            }
                        }
                    }
                } catch {
                    localStorage.removeItem(storageKey);
                }
                session[index] = data;
                localStorage.setItem(storageKey, JSON.stringify(session));

                const count = Object.keys(session).length;
                appendElement(app, "div", `Session ID: ${id}`, "status");
                appendElement(app, "div", `${count} / ${total} Loaded`, "progress");
                const grid = appendElement(app, "div", "", "grid");

                for (let i = 0; i < total; i++) {
                    const isFilled = session[i] !== undefined;
                    appendElement(grid, "div", String(i + 1), `tile${isFilled ? " filled" : ""}`);
                }

                if (count === total) {
                    const sortedData = Array.from({ length: total }, (_, i) => session[i]).join("");
                    const obsidianUri = `obsidian://setuplivesync?settingsQR=${sortedData}`;
                    appendElement(app, "p", "All parts have been collected!");
                    const link = appendElement(app, "a", "Open Obsidian to complete setup", "btn");
                    link.setAttribute("href", obsidianUri);
                    const note = appendElement(
                        app,
                        "p",
                        "Note: If the button does not respond, please ensure you are opening this in a browser that can trigger Obsidian."
                    );
                    note.style.marginTop = "20px";
                    note.style.fontSize = "0.8rem";
                    note.style.color = "#999";
                } else {
                    appendElement(app, "p", "Please scan the next QR code.", "status");
                    const button = appendElement(app, "button", "Waiting...", "btn");
                    button.disabled = true;
                }
            }

            window.addEventListener("hashchange", updateUI);
            updateUI();
        </script>
    </body>
</html>
