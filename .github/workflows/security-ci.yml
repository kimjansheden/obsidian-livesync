name: Security CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  attestations: read
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.7.0
          cache: npm

      - name: Verify the attested Commonlib dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dependency_dir=$(mktemp -d)
          package_url=$(node -p "require('./docs/security/commonlib-release.json').packageUrl")
          package_sha=$(node -p "require('./docs/security/commonlib-release.json').packageSha256")
          receipt_url=$(node -p "require('./docs/security/commonlib-release.json').sourceReceiptUrl")
          receipt_sha=$(node -p "require('./docs/security/commonlib-release.json').sourceReceiptSha256")
          repository=$(node -p "require('./docs/security/commonlib-release.json').repositorySlug")
          signer_workflow=$(node -p "require('./docs/security/commonlib-release.json').signerWorkflow")
          source_commit=$(node -p "require('./docs/security/commonlib-release.json').forkCommit")
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$package_url" --output "$dependency_dir/commonlib.tgz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$receipt_url" --output "$dependency_dir/source-receipt.json"
          printf '%s  %s\n' "$package_sha" "$dependency_dir/commonlib.tgz" | sha256sum --check
          printf '%s  %s\n' "$receipt_sha" "$dependency_dir/source-receipt.json" | sha256sum --check
          for artifact in "$dependency_dir/commonlib.tgz" "$dependency_dir/source-receipt.json"; do
            gh attestation verify "$artifact" --repo "$repository" --signer-workflow "$signer_workflow" --source-ref refs/heads/main --source-digest "$source_commit"
          done

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify repository security policy
        run: npm run security:policy && npm run test:release-workflow

      - name: Prove the release gate rejects security-state faults
        run: npm run test:security-state-faults

      - name: Mutation-test the release gate implementation
        run: npm run test:security-state-mutations

      - name: Audit the complete npm lock graph
        run: npm audit --audit-level=low

      - name: Type-check all applications
        run: npm run tsc-check && npm run tsc-check:apps

      - name: Run unit and contract tests
        run: npm run test:unit

      - name: Build the plugin
        run: npm run build

      - name: Verify generated plugin files exist
        run: test -s main.js && test -s manifest.json && test -s styles.css
